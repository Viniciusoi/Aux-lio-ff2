<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NuMenu</title>
    <!-- Fonte similar à usada pelo Nubank -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Roboto+Mono:wght@400;500&display=swap');

        :root {
            --bg-color: #1a1a1a; /* Fundo escuro neutro */
            --panel-bg: #2e2636; /* O Roxo clássico do Nubank */
            --primary-purple: #8924bb; /* Logo/Brand Color */
            --light-purple: #a55ea5;
            --text-color: #ffffff;
            --input-bg: #1a1a1a;
            --border-color: #444;
            --success: #00ff41;
            --error: #ff003c;
            --btn-hover: #6b1a8c;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nunito', sans-serif; /* Fonte arredondada e amigável */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Pattern Simulation */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.1;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-color) 90%),
                linear-gradient(0deg, transparent 95%, var(--primary-purple) 96%, transparent 97%),
                linear-gradient(90deg, transparent 95%, var(--primary-purple) 96%, transparent 97%);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* LOGIN SCREEN */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            background: var(--panel-bg);
            border-radius: 15px; /* Bordas mais arredondadas estilo app moderno */
            padding: 30px;
            box-shadow: 0 0 30px rgba(137, 36, 187, 0.2);
            transition: all 0.3s ease;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        /* NOVA LOGO ESTILO NUBANK */
        .nu-logo-circle {
            width: 60px;
            height: 60px;
            background-color: var(--primary-purple);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--primary-purple);
        }

        .nu-logo-text {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .version {
            font-size: 0.8rem;
            color: #ccc;
            font-family: 'Roboto Mono', monospace;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 8px rgba(137, 36, 187, 0.4);
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: var(--primary-purple);
            border: none;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background: var(--btn-hover);
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .status-msg {
            text-align: center;
            height: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .status-success { color: var(--success); }
        .status-error { color: var(--error); }

        .admin-btn {
            background: transparent;
            border: 1px solid #666;
            color: #aaa;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* MAIN MENU */
        #main-menu {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
            margin-bottom: 15px;
        }

        .user-info {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-btn {
            width: 35px;
            height: 35px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 6px;
        }

        .tab.active {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
            color: white;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--primary-purple); }

        .section-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .toggle-label {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Custom Checkbox */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-purple);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Range Slider */
        .range-container {
            margin: 15px 0;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary-purple);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px var(--primary-purple);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* Dropdown */
        .dropdown {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-family: 'Roboto Mono', monospace;
            margin-bottom: 10px;
            appearance: none;
            cursor: pointer;
        }

        .inject-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-purple);
            border: none;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-top: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        
        .inject-btn.injecting {
            background: #111;
            border: 1px solid var(--success);
            color: var(--success);
        }

        /* Admin Panel Overlay */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            padding: 20px;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--primary-purple);
            padding-bottom: 10px;
        }

        .keys-list {
            flex: 1;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #222;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: #aaa;
            cursor: pointer;
        }
        
        .key-item span { color: var(--primary-purple); }
        .key-item:active { background: #222; }

        .copy-hint {
            font-size: 0.7rem;
            color: #555;
            margin-top: 5px;
            text-align: center;
        }

        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(137, 36, 187, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(137, 36, 187, 0); }
            100% { box-shadow: 0 0 0 0 rgba(137, 36, 187, 0); }
        }

        .pulse-anim {
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="bg-pattern"></div>

    <div class="container">
        
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <div class="logo-area">
                <div class="nu-logo-circle">
                    <span style="font-weight:800; font-size:1.5rem;">N</span>
                </div>
                <div class="nu-logo-text">NU<span style="font-weight:400; font-size:1rem;">MENU</span></div>
                <div class="version">v3.0.2 BETA</div>
            </div>

            <div id="login-status" class="status-msg"></div>

            <div class="input-group">
                <label>NOME DO USUÁRIO</label>
                <input type="text" id="username" placeholder="Seu nome" autocomplete="off">
            </div>

            <div class="input-group">
                <label>CHAVE DE ACESSO</label>
                <input type="text" id="apikey" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
            </div>

            <button class="btn-main" onclick="attemptLogin()">ENTRAR</button>
            
            <button id="admin-login-btn" class="btn-main admin-btn" style="display:none;" onclick="showAdminPanel()">ÁREA ADMIN</button>
        </div>

        <!-- MAIN MENU -->
        <div id="main-menu">
            <div class="header">
                <div class="user-info">
                    <span id="display-name">USER</span>
                    <span style="font-size:0.7rem; color:#888; display:block; font-family:'Roboto Mono'">BETA VERSION</span>
                </div>
                <div class="close-btn" onclick="logout()">✕</div>
            </div>

            <div class="tabs">
                <div class="tab active">AIMBOT</div>
                <div class="tab">VISUAL</div>
                <div class="tab">MISC</div>
            </div>

            <div class="content-area">
                
                <div class="section-title">STATUS</div>
                <div class="control-row">
                    <span class="toggle-label">Ativar Auxílio</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="toggle-label">Ativar Fov</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="section-title">CONFIGURAÇÕES</div>
                
                <div class="range-container">
                    <div class="range-header">
                        <span>Fov</span>
                        <span id="fov-val">251</span>
                    </div>
                    <input type="range" min="100" max="360" value="251" oninput="document.getElementById('fov-val').innerText = this.value">
                </div>

                <div class="section-title">TIPO DE AIMBOT</div>
                <select class="dropdown">
                    <option>Ao Atirar</option>
                    <option>Ao Olhar</option>
                    <option>Mixto</option>
                </select>

                <div class="section-title">FEATURES</div>
                <div class="control-row">
                    <span class="toggle-label">Auxílio Recoil</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="toggle-label">Head Lock</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                 <div class="control-row">
                    <span class="toggle-label">Corpo Lock</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

            <button class="inject-btn" id="inject-btn" onclick="inject()">INJETAR FUNÇÕES NO JOGO</button>
        </div>

    </div>

    <!-- ADMIN PANEL OVERLAY -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2 style="margin:0; color:white;">ADMIN DEBUG</h2>
            <div class="close-btn" onclick="hideAdminPanel()">✕</div>
        </div>
        <div style="margin-bottom:10px; color:#888; font-size:0.8rem;">LISTA DE 20 CHAVES VÁLIDAS</div>
        <div class="keys-list" id="admin-keys-list">
            <!-- Populated by JS -->
        </div>
        <div class="copy-hint">Toque em uma key para copiar</div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const ADMIN_USER = "ADMIN";
        const ADMIN_PASS = "ADMIN"; 

        // Generate 20 random keys on load
        let validKeys = [];
        function generateKeys() {
            validKeys = [];
            for(let i=0; i<20; i++) {
                validKeys.push(generateRandomKey());
            }
            console.log("Generated Keys:", validKeys);
        }

        function generateRandomKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "";
            for(let i=0; i<12; i++) {
                if(i > 0 && i % 4 === 0) key += "-";
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        let currentUser = null;
        let isAdminUser = false;

        // Init
        generateKeys();
        renderAdminKeys();

        // --- DOM ELEMENTS ---
        const loginScreen = document.getElementById('login-screen');
        const mainMenu = document.getElementById('main-menu');
        const loginStatus = document.getElementById('login-status');
        const usernameInput = document.getElementById('username');
        const apikeyInput = document.getElementById('apikey');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const adminPanel = document.getElementById('admin-panel');
        const adminKeysList = document.getElementById('admin-keys-list');

        // --- FUNCTIONS ---

        function attemptLogin() {
            const name = usernameInput.value.trim().toUpperCase();
            const key = apikeyInput.value.trim().toUpperCase();
            
            loginStatus.className = "status-msg";
            loginStatus.innerText = "";

            // Check Admin Logic
            if (name === ADMIN_USER && key === ADMIN_PASS) {
                loginSuccess(name, true);
                return;
            }

            // Check User Logic
            if (validKeys.includes(key)) {
                loginSuccess(name, false);
            } else {
                showError("CHAVE INVÁLIDA OU CREDENCIAIS ERRADAS.");
            }
        }

        function loginSuccess(name, isAdmin) {
            loginStatus.innerText = "ACESSO PERMITIDO!";
            loginStatus.classList.add("status-success");
            
            currentUser = name;
            isAdminUser = isAdmin;

            setTimeout(() => {
                loginScreen.style.display = 'none';
                mainMenu.style.display = 'flex';
                document.getElementById('display-name').innerText = name;
                
                // Show admin button only if logged in as admin
                if(isAdmin) {
                    adminLoginBtn.style.display = 'block';
                } else {
                    adminLoginBtn.style.display = 'none';
                }
            }, 800);
        }

        function showError(msg) {
            loginStatus.innerText = msg;
            loginStatus.classList.add("status-error");
            
            // Shake effect
            loginScreen.style.transform = "translateX(10px)";
            setTimeout(() => loginScreen.style.transform = "translateX(-10px)");
            setTimeout(() => loginScreen.style.transform = "translateX(5px)");
            setTimeout(() => loginScreen.style.transform = "translateX(0)");
        }

        function logout() {
            mainMenu.style.display = 'none';
            loginScreen.style.display = 'flex';
            usernameInput.value = "";
            apikeyInput.value = "";
            loginStatus.innerText = "";
            loginStatus.className = "status-msg";
        }

        // --- ADMIN PANEL LOGIC ---
        function showAdminPanel() {
            adminPanel.style.display = 'flex';
            renderAdminKeys();
        }

        function hideAdminPanel() {
            adminPanel.style.display = 'none';
        }

        function renderAdminKeys() {
            adminKeysList.innerHTML = "";
            validKeys.forEach((k, index) => {
                const div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `<span>#${index+1}</span> <span>${k}</span>`;
                div.onclick = () => copyToClipboard(k);
                adminKeysList.appendChild(div);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Key copiada: " + text);
            });
        }

        // --- INJECT BUTTON LOGIC ---
        function inject() {
            const btn = document.getElementById('inject-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "INJETANDO...";
            btn.classList.add('injecting');
            
            setTimeout(() => {
                btn.innerText = "INJETADO COM SUCESSO";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('injecting');
                }, 2000);
            }, 1500);
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && loginScreen.style.display !== 'none') {
                attemptLogin();
            }
        });

    </script>
</body>
</html>
