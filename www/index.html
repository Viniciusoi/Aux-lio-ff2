<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nu Screets</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap');

        :root {
            /* Variáveis Tema Principal (Dark/Red) */
            --bg-color: #0a0a0a;
            --panel-bg: rgba(20, 20, 25, 0.95);
            --primary-red: #ff2a2a;
            --dark-red: #8b0000;
            --text-color: #e0e0e0;
            --input-bg: #15151a;
            --border-color: #333;
            --success: #00ff41;
            --error: #ff003c;
            
            /* Variáveis Login (Nubank Style) */
            --nu-white: #ffffff;
            --nu-black: #000000;
            --nu-purple: #8924bb;
            --nu-gray: #a6a6b2;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Nunito', sans-serif; /* Default font for login */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- BACKGROUND EFFECTS (MAIN MENU) --- */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.15;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-color) 90%),
                linear-gradient(0deg, transparent 95%, var(--primary-red) 96%, transparent 97%),
                linear-gradient(90deg, transparent 95%, var(--primary-red) 96%, transparent 97%);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
            display: none; /* Hidden on login */
        }

        .geo-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            stroke: var(--primary-red);
            stroke-width: 1;
            fill: none;
            opacity: 0.2;
            display: none;
        }

        /* --- LOGIN SCREEN (NUBANK STYLE) --- */
        #login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: var(--nu-white);
            color: var(--nu-black);
            transition: all 0.3s ease;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-img {
            width: 60px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--nu-black);
            letter-spacing: 1px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            background: #f5f5f5;
            border: 1px solid #ddd;
            color: #000;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            font-family: 'Nunito', sans-serif;
        }

        input[type="text"]:focus {
            border-color: var(--nu-purple);
            box-shadow: 0 0 0 2px rgba(137, 36, 187, 0.2);
        }

        .btn-nu {
            width: 100%;
            padding: 15px;
            background: var(--nu-purple);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Nunito', sans-serif;
        }

        .btn-nu:active {
            transform: scale(0.98);
        }

        .status-msg {
            height: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        /* --- MAIN MENU (DARK THEME) --- */
        #main-menu {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            background: var(--bg-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .user-info {
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
        }

        .close-btn {
            width: 30px;
            height: 30px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            background: #111;
            border: 1px solid #333;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .tab.active {
            background: var(--dark-red);
            border-color: var(--primary-red);
            color: white;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; }

        .section-title {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
            font-family: 'Roboto Mono', monospace;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .toggle-label {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Custom Checkbox */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-red);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Range Slider */
        .range-container {
            margin: 15px 0;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--primary-red);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px var(--dark-red);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* Dropdown */
        .dropdown {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            color: white;
            font-family: 'Roboto Mono', monospace;
            margin-bottom: 10px;
            appearance: none;
            cursor: pointer;
        }

        .inject-btn {
            width: 100%;
            padding: 15px;
            background: var(--dark-red);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-top: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .inject-btn.injecting {
            background: #000;
            border: 1px solid var(--success);
            color: var(--success);
        }

        /* Admin Panel Overlay */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            padding: 20px;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--primary-red);
            padding-bottom: 10px;
        }

        .keys-list {
            flex: 1;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border: 1px solid #333;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #222;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: #aaa;
        }
        
        .key-item span { color: var(--primary-red); }

        .copy-hint {
            font-size: 0.7rem;
            color: #555;
            margin-top: 5px;
            text-align: center;
        }

        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 42, 42, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0); }
        }

        .pulse-anim {
            animation: pulse 2s infinite;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .visible { display: flex !important; }

    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="bg-pattern"></div>
    <svg class="geo-lines" width="100%" height="100%">
        <path d="M0,50 L100,50 M0,150 L100,150 M0,250 L100,250" />
        <path d="M50,0 L50,100 M150,0 L150,100" />
    </svg>

    <div class="container">
        
        <!-- TELA 1: CPF (Nubank Style) -->
        <div id="cpf-screen">
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:30px;">
                <div class="logo-area">
                    <!-- SVG Logo Nubank -->
                    <svg class="logo-img" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="25" cy="25" r="25" fill="#8924bb"/>
                        <path d="M15 25 L25 15 L35 25 L25 35 Z" fill="white"/>
                    </svg>
                    <div class="logo-text">Nu Screets</div>
                </div>

                <div id="cpf-status" class="status-msg"></div>

                <div class="input-group">
                    <label>CPF</label>
                    <input type="text" id="cpf-input" placeholder="000.000.000-00" autocomplete="off">
                </div>

                <button class="btn-nu" onclick="checkCpf()">Continuar</button>
            </div>
        </div>

        <!-- TELA 2: LOGIN REAL (Dark Theme) -->
        <div id="login-screen" class="hidden">
            <div class="logo-area">
                <div class="logo-text">SOARES<span style="color:white; font-size:0.6em;">SCREETS</span></div>
                <div class="version" style="font-size: 0.8rem; color: #666; font-family:'Roboto Mono'">v3.0.2 [BETA]</div>
            </div>

            <div id="login-status" class="status-msg"></div>

            <div class="input-group">
                <label>NOME (Ex: PLAYER)</label>
                <input type="text" id="username" placeholder="Digite seu nome" autocomplete="off">
            </div>

            <div class="input-group">
                <label>CHAVE DE ACESSO (KEY)</label>
                <input type="text" id="apikey" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
            </div>

            <button class="btn-main" style="width:100%; padding:15px; background:var(--dark-red); border:1px solid var(--primary-red); color:white; font-weight:700; font-family:'Rajdhani'; font-size:1.1rem; cursor:pointer; border-radius:4px; margin-top:10px;" onclick="attemptLogin()">ENTRAR</button>
            
            <button id="admin-login-btn" style="background:transparent; border:1px solid #444; color:#666; margin-top:10px; font-size:0.9rem; width:100%; padding:10px; cursor:pointer; display:none;" onclick="showAdminPanel()">ÁREA ADMIN (DEBUG)</button>
        </div>

        <!-- MAIN MENU -->
        <div id="main-menu">
            <div class="header">
                <div class="user-info">
                    <span id="display-name">USER</span>
                    <span style="font-size:0.7rem; color:#666; display:block; font-family:'Roboto Mono'">v3.0.2 BETA</span>
                </div>
                <div class="close-btn" onclick="logout()">✕</div>
            </div>

            <div class="tabs">
                <div class="tab active">AIMBOT</div>
                <div class="tab">VISUAL</div>
                <div class="tab">MISC</div>
            </div>

            <div class="content-area">
                
                <div class="section-title">STATUS</div>
                <div class="control-row">
                    <span class="toggle-label">Ativar Auxílio</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="toggle-label">Ativar Fov</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="section-title">CONFIGURAÇÕES</div>
                
                <div class="range-container">
                    <div class="range-header">
                        <span>Fov</span>
                        <span id="fov-val">251</span>
                    </div>
                    <input type="range" min="100" max="360" value="251" oninput="document.getElementById('fov-val').innerText = this.value">
                </div>

                <div class="section-title">TIPO DE AIMBOT</div>
                <select class="dropdown">
                    <option>Ao Atirar</option>
                    <option>Ao Olhar</option>
                    <option>Mixto</option>
                </select>

                <div class="section-title">FEATURES</div>
                <div class="control-row">
                    <span class="toggle-label">Auxílio Recoil</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="toggle-label">Head Lock</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                 <div class="control-row">
                    <span class="toggle-label">Corpo Lock</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

            <button class="inject-btn" id="inject-btn" onclick="inject()">INJETAR FUNÇÕES NO JOGO</button>
        </div>

    </div>

    <!-- ADMIN PANEL OVERLAY -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2 style="margin:0; color:var(--primary-red);">ADMIN DEBUG</h2>
            <div class="close-btn" onclick="hideAdminPanel()">✕</div>
        </div>
        <div style="margin-bottom:10px; color:#888; font-size:0.8rem;">LISTA DE 20 CHAVES VÁLIDAS</div>
        <div class="keys-list" id="admin-keys-list">
            <!-- Populated by JS -->
        </div>
        <div class="copy-hint">Toque em uma key para copiar</div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const ADMIN_USER = "ADMIN";
        const ADMIN_PASS = "ADMIN"; 

        // Generate 20 random keys on load
        let validKeys = [];
        function generateKeys() {
            validKeys = [];
            for(let i=0; i<20; i++) {
                validKeys.push(generateRandomKey());
            }
            console.log("Generated Keys:", validKeys);
        }

        function generateRandomKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "";
            for(let i=0; i<12; i++) {
                if(i > 0 && i % 4 === 0) key += "-";
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        let currentUser = null;
        let isAdminUser = false;

        // Init
        generateKeys();
        renderAdminKeys();

        // --- DOM ELEMENTS ---
        const cpfScreen = document.getElementById('cpf-screen');
        const loginScreen = document.getElementById('login-screen');
        const mainMenu = document.getElementById('main-menu');
        const cpfStatus = document.getElementById('cpf-status');
        const cpfInput = document.getElementById('cpf-input');
        
        const loginStatus = document.getElementById('login-status');
        const usernameInput = document.getElementById('username');
        const apikeyInput = document.getElementById('apikey');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const adminPanel = document.getElementById('admin-panel');
        const adminKeysList = document.getElementById('admin-keys-list');

        // --- FUNCTIONS ---

        // 1. Check CPF Screen
        function checkCpf() {
            cpfStatus.className = "status-msg";
            cpfStatus.innerText = "";

            // If empty, go to real login
            if (!cpfInput.value.trim()) {
                cpfScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                loginScreen.style.display = 'flex';
                cpfScreen.style.display = 'none';
            } else {
                cpfStatus.innerText = "CPF não encontrado.";
                cpfStatus.classList.add("status-error");
            }
        }

        // 2. Attempt Login (Real)
        function attemptLogin() {
            const name = usernameInput.value.trim().toUpperCase();
            const key = apikeyInput.value.trim().toUpperCase();
            
            loginStatus.className = "status-msg";
            loginStatus.innerText = "";

            // Check Admin Logic
            if (name === ADMIN_USER && key === ADMIN_PASS) {
                loginSuccess(name, true);
                return;
            }

            // Check User Logic
            if (validKeys.includes(key)) {
                loginSuccess(name, false);
            } else {
                showError("CHAVE INVÁLIDA OU CREDENCIAIS ERRADAS.");
            }
        }

        function loginSuccess(name, isAdmin) {
            loginStatus.innerText = "ACESSO PERMITIDO!";
            loginStatus.classList.add("status-success");
            
            currentUser = name;
            isAdminUser = isAdmin;

            setTimeout(() => {
                loginScreen.classList.add('hidden');
                loginScreen.style.display = 'none';
                mainMenu.style.display = 'flex';
                document.getElementById('display-name').innerText = name;
                
                // Show admin button only if logged in as admin
                if(isAdmin) {
                    adminLoginBtn.style.display = 'block';
                } else {
                    adminLoginBtn.style.display = 'none';
                }
            }, 800);
        }

        function showError(msg) {
            loginStatus.innerText = msg;
            loginStatus.classList.add("status-error");
            
            // Shake effect
            loginScreen.style.transform = "translateX(10px)";
            setTimeout(() => loginScreen.style.transform = "translateX(-10px)");
            setTimeout(() => loginScreen.style.transform = "translateX(5px)");
            setTimeout(() => loginScreen.style.transform = "translateX(0)");
        }

        function logout() {
            mainMenu.style.display = 'none';
            loginScreen.classList.remove('hidden');
            loginScreen.style.display = 'flex';
            usernameInput.value = "";
            apikeyInput.value = "";
            loginStatus.innerText = "";
            loginStatus.className = "status-msg";
        }

        // --- ADMIN PANEL LOGIC ---
        function showAdminPanel() {
            adminPanel.style.display = 'flex';
            renderAdminKeys();
        }

        function hideAdminPanel() {
            adminPanel.style.display = 'none';
        }

        function renderAdminKeys() {
            adminKeysList.innerHTML = "";
            validKeys.forEach((k, index) => {
                const div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `<span>#${index+1}</span> <span>${k}</span>`;
                div.onclick = () => copyToClipboard(k);
                adminKeysList.appendChild(div);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Key copiada: " + text);
            });
        }

        // --- INJECT BUTTON LOGIC ---
        function inject() {
            const btn = document.getElementById('inject-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "INJETANDO...";
            btn.classList.add('injecting');
            
            setTimeout(() => {
                btn.innerText = "INJETADO COM SUCESSO";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('injecting');
                }, 2000);
            }, 1500);
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if (!loginScreen.classList.contains('hidden')) {
                    attemptLogin();
                } else if (!cpfScreen.classList.contains('hidden')) {
                    checkCpf();
                }
            }
        });

    </script>
</body>
</html>
